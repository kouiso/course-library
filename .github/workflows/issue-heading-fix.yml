name: Fix issue form headings
# Manual only: lifts ### to ## and #### to ### in one issue body. Never starts on events.
on:
  workflow_dispatch:
    inputs:
      number:
        description: Issue number
        type: string
        required: true
permissions:
  contents: read
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Lift headings only when the body would change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ inputs.number }}
        run: node scripts/automation/heading-fix.mjs
