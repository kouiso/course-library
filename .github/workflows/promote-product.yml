name: Promote product release to catalogue

# 商品リポジトリ（task-app / redmine-clone）の deploy-r2.yml が R2 への配置を
# 終えたあとに呼ばれ、購入者に見せる版を manifest.ts で指し替える PR を開く。
# ZIP の配置と「見せる版の選択」は別の関門: このワークフローは PR を作るまでで、
# 公開は PR のレビューとマージ（→ verify.yml の deploy）で決まる。
#
# 起き方は2つ:
# - repository_dispatch（type: product-release）: 商品リポジトリからの自動通知。
#   client_payload: {"collection": "<id>", "version": "<semver>", "date": "<YYYY-MM-DD>",
#                    "sha256": "<zip の sha256>", "source": "<repo>@<run_id>"}
# - workflow_dispatch: 手動での切り替え・巻き戻し。collection と version は必須。
#
# 自動通知を受ける側の準備（商品リポジトリ側の secrets）:
# - GitHub App: APP_ID / APP_PRIVATE_KEY（course-library への contents:write 相当、
#   repository_dispatch を打てるもの。installation id はトークン作成時に解決される）
# - なければ COURSE_LIBRARY_TOKEN（fine-grained PAT で contents:write をこのリポジトリに）
# - どちらも無いときは商品側の workflow が手動実行用の gh コマンドを summary に出すだけで、
#   このワークフローは呼ばれない（リリース自体は失敗しない）。

on:
  repository_dispatch:
    types: [product-release]
  workflow_dispatch:
    inputs:
      collection:
        description: 商品コレクション id（redmine-clone / task-app）
        required: true
        type: string
      version:
        description: "購入者に出す版（例: 1.2.0）。先に releases/<collection>/<version>/ へ配置済みのもの"
        required: true
        type: string
      date:
        description: 配布日（YYYY-MM-DD、省略時は実行日）
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# 同時に2つの昇格が走ると manifest.ts で競合する。実行中のものは止めない。
concurrency:
  group: promote-product
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve inputs
        id: args
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_COLLECTION: ${{ inputs.collection }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            node -e '
              const fs = require("fs");
              const p = JSON.parse(process.env.PAYLOAD || "{}");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, [
                `collection=${p.collection || ""}`,
                `version=${p.version || ""}`,
                `date=${p.date || ""}`,
                `sha256=${p.sha256 || ""}`,
                `source=${p.source || ""}`,
              ].join("\n") + "\n");
            '
          else
            {
              echo "collection=${INPUT_COLLECTION}"
              echo "version=${INPUT_VERSION}"
              echo "date=${INPUT_DATE}"
              echo "sha256="
              echo "source=manual (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            } >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q '^collection=.' "$GITHUB_OUTPUT" || ! grep -q '^version=.' "$GITHUB_OUTPUT"; then
            echo "::error::collection と version は必須です（payload か inputs が空でした）"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      # The "Verify the candidate commit" step runs npm run check, which needs pdfinfo and pdftotext
      # (tests/candidate.test.mjs); the runner image does not list poppler-utils.
      - name: Install poppler for pdfinfo and pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare release branch and update manifest
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION: ${{ steps.args.outputs.collection }}
          VERSION: ${{ steps.args.outputs.version }}
          DATE: ${{ steps.args.outputs.date }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="release/${COLLECTION}-${VERSION}"
          node scripts/automation/promote-product.mjs --collection "$COLLECTION" --version "$VERSION" ${DATE:+--date "$DATE"} | tee /tmp/promote.log
          if git diff --quiet src/manifest.ts; then
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
            echo "manifest は既に ${COLLECTION} ${VERSION} を指しています。PR は作りません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git restore src/manifest.ts
          gh auth setup-git
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git fetch origin "$branch"
            open_pr="$(gh pr list --head "$branch" --state open --json url -q '.[0].url')"
            if [ -n "$open_pr" ] || git merge-base --is-ancestor "$base_sha" FETCH_HEAD; then
              git switch -C "$branch" FETCH_HEAD
            else
              branch="release/${COLLECTION}-${VERSION}-$(date -u +%Y%m%d%H%M%S)"
              git switch -c "$branch"
            fi
          else
            git switch -c "$branch"
          fi
          node scripts/automation/promote-product.mjs --collection "$COLLECTION" --version "$VERSION" ${DATE:+--date "$DATE"} | tee /tmp/promote.log
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet src/manifest.ts; then
            echo "needs_push=true" >> "$GITHUB_OUTPUT"
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$base_sha" HEAD; then
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the candidate commit
        if: steps.update.outputs.needs_pr == 'true'
        run: npm run check

      - name: Push branch and open the promotion PR
        if: steps.update.outputs.needs_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
          NEEDS_PUSH: ${{ steps.update.outputs.needs_push }}
          COLLECTION: ${{ steps.args.outputs.collection }}
          VERSION: ${{ steps.args.outputs.version }}
          SHA256: ${{ steps.args.outputs.sha256 }}
          SOURCE: ${{ steps.args.outputs.source }}
        run: |
          branch="$BRANCH"
          gh auth setup-git
          if [ "$NEEDS_PUSH" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/manifest.ts
            git commit -m "feat(manifest): ${COLLECTION} の配布版を ${VERSION} へ"
            git push -u origin "$branch"
          fi
          existing_pr="$(gh pr list --head "$branch" --state open --json url -q '.[0].url')"
          if [ -n "$existing_pr" ]; then
            echo "既存の昇格 PR を維持します: ${existing_pr}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "関連 Issue"
            echo ""
            echo "なし（リリース通知からの自動起票）"
            echo ""
            echo "概要・背景・妥協点"
            echo ""
            echo "商品リポジトリのリリースで \`releases/${COLLECTION}/${VERSION}/\` へ ZIP が配置されたため、"
            echo "購入者に見せる版を ${VERSION} に指し替えます。配置と公開は別の関門で、"
            echo "この PR のレビュー・マージが公開の決め手です。"
            echo ""
            echo "やったこと"
            echo ""
            echo "- \`src/manifest.ts\` の ${COLLECTION} 用 release 定数を version=${VERSION} に更新"
            echo "- \`npm run check\`（manifest 検査・型・テスト）を同じ commit で通過済み"
            if [ -n "${SHA256}" ]; then echo "- 配置された ZIP の sha256: \`${SHA256}\`"; fi
            if [ -n "${SOURCE}" ]; then echo "- 通知元: ${SOURCE}"; fi
            echo ""
            echo "確認してほしいこと"
            echo ""
            echo "- [ ] R2 の \`releases/${COLLECTION}/${VERSION}/\` に商品 ZIP がある（rclone lsl またはダッシュボード）"
            echo "- [ ] 教材本文を配る商品なら、R2 の \`releases/${COLLECTION}/${VERSION}/${COLLECTION}-textbook.zip\` もあり、0 バイトでない（無い・空だと、この版では商品ページから本文が消える）"
            echo "- [ ] 版番号・配布日が意図どおり"
            echo "- [ ] マージ後に verify.yml の deploy で本番へ出す判断"
          } > /tmp/pr-body.md
          gh pr create --head "$branch" --title "release: ${COLLECTION} の配布版を ${VERSION} へ" --body-file /tmp/pr-body.md
